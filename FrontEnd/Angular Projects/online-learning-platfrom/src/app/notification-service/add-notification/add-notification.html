<h2>Add Notification</h2>
<form (ngSubmit)="addNotification()">
  <label>User ID:</label>
  <input type="number" [(ngModel)]="notification.userId" name="userId" required><br>

  <label>Message:</label>
  <input type="text" [(ngModel)]="notification.message" name="message" required><br>

  <label>Is Read:</label>
  <input type="checkbox" [(ngModel)]="notification.read" name="read"><br>

  <button type="submit">Add</button>
</form>
