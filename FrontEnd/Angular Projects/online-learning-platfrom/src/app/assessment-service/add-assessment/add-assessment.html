<h1>Add Assessment</h1>
<form>
  <label>Enter Title</label>
  <input type="text" [(ngModel)]="assessment.title" name="title"><br>

  <label>Enter Description</label>
  <input type="text" [(ngModel)]="assessment.description" name="description"><br>

  <label>Enter Total Marks</label>
  <input type="number" [(ngModel)]="assessment.totalMarks" name="totalMarks"><br>

  <label>Enter Pass Marks</label>
  <input type="number" [(ngModel)]="assessment.passMarks" name="passMarks"><br>

  <button type="submit" (click)="onSubmit()">Add</button>
  <button type="reset">Reset</button>
</form>
