<h2>All Assessments</h2>

<div *ngIf="errorMessage" style="color:red;">{{ errorMessage }}</div>

<div *ngIf="!assessments.length && !errorMessage">
  Loading ...
</div>

<div *ngIf="assessments.length > 0" class="assessment-list">
  <div class="assessment-header">
    <strong>ID</strong>
    <strong>Title</strong>
    <strong>Description</strong>
    <strong>Total Marks</strong>
    <strong>Pass Marks</strong>
  </div>

  <div *ngFor="let assessment of assessments" class="assessment-row">
    <div>{{ assessment.id }}</div>
    <div>{{ assessment.title }}</div>
    <div>{{ assessment.description }}</div>
    <div>{{ assessment.totalMarks }}</div>
    <div>{{ assessment.passMarks }}</div>
    <div><button (click)="editAssessment(assessment.id)">Edit</button></div>
    <div><button (click)="deleteAssessment(assessment.id)">Delete</button></div>
  </div>
</div>

<br />
<a href="/add-assessment">Add Assessment</a> |
<a href="/">Back To Main Menu</a>
